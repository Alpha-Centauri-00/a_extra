[project]
name = "a-extra"
version = "0.1.0"
description = "Instead of invoking invisible 'dark matter,' we test a hypothesis: the angular momentum (spin) of a galaxy creates a small extra acceleration that naturally explains why galaxy rotation curves remain flat at large distances."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "contourpy>=1.3.3",
    "cycler>=0.12.1",
    "fonttools>=4.61.1",
    "kiwisolver>=1.4.9",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "packaging>=25.0",
    "pillow>=12.0.0",
    "pyparsing>=3.3.1",
    "python-dateutil>=2.9.0.post0",
    "scipy>=1.17.0",
    "six>=1.17.0",
]
